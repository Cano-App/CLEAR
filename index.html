<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#07212b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CLEAR">
<title>CLEAR</title>
<style>
  :root {
    --ink: #07212b;
    --glass: rgba(7, 33, 43, .56);
    --glass-strong: rgba(7, 33, 43, .78);
    --line: rgba(243, 233, 210, .16);
    --sand: #f3e9d2;
    --mist: rgba(243, 233, 210, .7);
    --amber: #f5b841;
    --flare: #ff6b4a;
    --radius-panel: 28px;
    --radius-row: 16px;
    --pad: clamp(18px, 5vw, 44px);
    --measure: 1080px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ink);
    color: var(--sand);
    font-family: "Avenir Next", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  button, input { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }

  /* The picture that stays put. A fixed layer works on iPhone,
     where background-attachment: fixed does not. */
  .backdrop {
    position: fixed;
    inset: 0;
    height: 100lvh;
    z-index: -1;
    overflow: hidden;
    background: var(--ink);
  }
  /* Stand-in sky, shown wherever a picture has not been added yet. */
  .backdrop::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(120% 60% at 78% 38%, rgba(245, 184, 65, .85) 0%, rgba(255, 107, 74, .5) 28%, transparent 60%),
      linear-gradient(180deg, #123f55 0%, #1f6f7d 30%, #e0915a 52%, #0c3a46 54%, #07212b 100%);
    filter: hue-rotate(var(--hue, 0deg));
    transition: filter .8s ease;
  }
  .backdrop img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity .7s ease;
  }
  .backdrop img.on { opacity: 1; }
  .backdrop::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(7, 33, 43, .5) 0%, rgba(7, 33, 43, .3) 40%, rgba(7, 33, 43, .6) 100%);
  }

  .wordmark {
    margin: 0;
    font-size: clamp(5rem, 27vw, 15rem);
    font-weight: 800;
    line-height: .8;
    letter-spacing: -.045em;
    margin-left: -.05em;
    color: var(--sand);
    text-shadow: 0 2px 40px rgba(7, 33, 43, .35);
  }

  /* ---------- Lock screen ---------- */
  .lock {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 22px;
    padding: var(--pad);
    padding-bottom: calc(var(--pad) + env(safe-area-inset-bottom));
    max-width: var(--measure);
    margin: 0 auto;
  }
  .lock p { margin: 0; color: var(--sand); font-size: 1.15rem; max-width: 26ch; }
  .lock form {
    display: flex;
    gap: 10px;
    max-width: 460px;
    padding: 8px;
    border-radius: 999px;
    background: var(--glass-strong);
    border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    backdrop-filter: blur(22px) saturate(140%);
  }
  .lock input {
    flex: 1;
    min-width: 0;
    background: none;
    border: 0;
    padding: 12px 16px;
    font-size: 17px;
    border-radius: 999px;
  }
  .lock input::placeholder, .search input::placeholder { color: var(--mist); }
  .lock button, .action-primary {
    border: 0;
    border-radius: 999px;
    padding: 12px 22px;
    background: var(--amber);
    color: var(--ink);
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .lock button[disabled] { opacity: .6; cursor: progress; }
  .lock .status { min-height: 1.5em; font-size: 1rem; max-width: 40ch; color: var(--sand); }

  /* ---------- Hub ---------- */
  /* Short header: the bubbles start on the first screen. */
  .hero {
    padding: calc(var(--pad) + env(safe-area-inset-top)) var(--pad) 20px;
    max-width: var(--measure);
    margin: 0 auto;
  }
  .hero .wordmark { font-size: clamp(3.6rem, 18vw, 8rem); }
  .hero .meaning {
    margin: 14px 0 0;
    font-size: clamp(1.05rem, 4.5vw, 1.6rem);
    font-weight: 500;
    line-height: 1.25;
    text-shadow: 0 1px 18px rgba(7, 33, 43, .75);
  }
  .hero .meaning b { font-weight: 800; color: var(--amber); }
  .hero .updated { margin: 6px 0 0; color: var(--sand); opacity: .8; font-size: .9rem; text-shadow: 0 1px 12px rgba(7, 33, 43, .8); }

  .bar {
    position: sticky;
    top: 0;
    z-index: 5;
    padding: calc(10px + env(safe-area-inset-top)) var(--pad) 10px;
    background: rgb(7, 33, 43);
    border-block: 1px solid var(--line);
    -webkit-backdrop-filter: blur(24px) saturate(150%);
    backdrop-filter: blur(24px) saturate(150%);
  }
  .bar-inner { max-width: var(--measure); margin: 0 auto; display: grid; gap: 10px; }
  .search { position: relative; }
  .search svg { position: absolute; left: 16px; top: 50%; translate: 0 -50%; opacity: .7; pointer-events: none; }
  .search input {
    width: 100%;
    padding: 13px 16px 13px 46px;
    font-size: 17px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(243, 233, 210, .1);
  }
  .jump { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: calc(var(--pad) * -1); padding-inline: var(--pad); }
  .jump::-webkit-scrollbar { display: none; }
  .jump a {
    flex: none;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    text-decoration: none;
    font-size: .95rem;
    font-weight: 600;
  }

  main { max-width: var(--measure); min-height: 62svh; margin: 0 auto; padding: 0 var(--pad); }
  footer span { padding: 9px 16px; border-radius: 999px; background: var(--glass-strong); }

  .panel {
    margin-block: 13vh;
    padding: clamp(20px, 4.5vw, 40px);
    border-radius: var(--radius-panel);
    background: var(--glass);
    border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(26px) saturate(150%);
    backdrop-filter: blur(26px) saturate(150%);
    scroll-margin-top: 150px;
  }
  .panel:first-child { margin-top: 5vh; }
  .panel h2 {
    margin: 0;
    font-size: clamp(1.7rem, 5.4vw, 2.6rem);
    font-weight: 800;
    letter-spacing: -.025em;
    line-height: 1.05;
  }
  .panel .blurb { margin: 8px 0 22px; color: var(--mist); max-width: 46ch; }

  .items { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .items.contacts { grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
  .items.services, .items.documents { grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); }

  .item {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 6px 12px;
    padding: 16px 14px 16px 18px;
    border-radius: var(--radius-row);
    background: rgba(243, 233, 210, .08);
    border: 1px solid transparent;
  }
  .item.urgent { border-color: rgba(255, 107, 74, .7); background: rgba(255, 107, 74, .14); }
  .item h3 { margin: 0; font-size: 1.1rem; font-weight: 700; line-height: 1.2; }
  .item .note { margin: 3px 0 0; color: var(--mist); font-size: .95rem; }
  .item .actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .item .actions:empty { display: none; }
  .action {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(243, 233, 210, .1);
    font-weight: 700;
    text-decoration: none;
    font-size: 1rem;
  }
  .action.action-primary { border-color: transparent; background: var(--amber); color: var(--ink); }
  .item.urgent .action.action-primary { background: var(--flare); color: #fff; }
  .pending { color: var(--mist); font-size: .9rem; font-style: italic; }

  .pin {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 50%;
    background: none;
    cursor: pointer;
    opacity: .55;
  }
  .pin[aria-pressed="true"] { opacity: 1; color: var(--amber); }
  .pin[aria-pressed="true"] svg { fill: currentColor; }

  /* ---------- Bubble view ---------- */
  .bar-row { display: flex; gap: 10px; align-items: center; }
  .bar-row .search { flex: 1; min-width: 0; }
  .view-toggle {
    flex: none;
    border: 1px solid var(--line);
    background: rgba(243, 233, 210, .1);
    border-radius: 999px;
    padding: 13px 18px;
    font-weight: 700;
    cursor: pointer;
  }

  .cluster { margin-block: 9vh; scroll-margin-top: 150px; }
  .cluster:first-child, .shortcuts + #sections .cluster:first-child { margin-top: 5vh; }
  .cluster h2 {
    margin: 0;
    font-size: clamp(1.7rem, 5.4vw, 2.6rem);
    font-weight: 800;
    letter-spacing: -.025em;
    line-height: 1.05;
    text-shadow: 0 1px 24px rgba(7, 33, 43, .7);
  }
  .cluster .blurb { margin: 8px 0 22px; max-width: 46ch; font-weight: 500; text-shadow: 0 1px 3px rgb(7, 33, 43), 0 0 14px rgb(7, 33, 43); }

  /* Rows of four and three, each row nudged half a step: a honeycomb. */
  .honeycomb {
    --cols: 4;
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(calc(var(--cols) * 2), 1fr);
    row-gap: 4px;
  }
  .honeycomb li { grid-column: span 2; min-width: 0; display: flex; justify-content: center; }
  .honeycomb li:nth-child(7n+5) { grid-column: 2 / span 2; }
  @media (min-width: 700px) {
    .honeycomb { --cols: 6; }
    .honeycomb li:nth-child(7n+5) { grid-column: span 2; }
    .honeycomb li:nth-child(11n+7) { grid-column: 2 / span 2; }
  }
  @media (min-width: 1000px) {
    .honeycomb { --cols: 8; }
    .honeycomb li:nth-child(11n+7) { grid-column: span 2; }
    .honeycomb li:nth-child(15n+9) { grid-column: 2 / span 2; }
  }

  .bubble {
    width: 100%;
    min-width: 0;
    padding: 0 3px;
    border: 0;
    background: none;
    cursor: pointer;
    display: grid;
    justify-items: center;
    gap: 7px;
    -webkit-tap-highlight-color: transparent;
    text-decoration: none;
  }
  .disc {
    width: clamp(64px, 18vw, 96px);
    aspect-ratio: 1;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(7, 33, 43, .78);
    border: 1.5px solid rgba(243, 233, 210, .5);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), 0 10px 28px rgba(7, 33, 43, .4);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    backdrop-filter: blur(16px) saturate(160%);
    transform: scale(var(--s, 1));
    will-change: transform;
  }
  .disc svg { width: 44%; height: 44%; }
  .disc .initials { font-weight: 800; font-size: 1.35rem; letter-spacing: -.02em; }
  .k-contacts .disc { background: rgba(245, 184, 65, .92); color: var(--ink); border-color: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .k-contacts.urgent .disc { background: rgba(255, 107, 74, .94); color: #fff; }
  .k-documents .disc { background: rgba(243, 233, 210, .9); color: var(--ink); border-color: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }

  /* Home page: one large bubble per category. */
  .categories {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 22px 8px;
  }
  .categories li { width: clamp(104px, 30%, 190px); display: flex; justify-content: center; }
  .categories .disc { width: clamp(88px, 25vw, 150px); }
  .categories .label { font-size: .95rem; font-weight: 700; }
  .jump a[aria-current="page"] { background: var(--amber); color: var(--ink); border-color: transparent; }
  .bubble:active .disc { filter: brightness(1.15); }
  .bubble .label {
    max-width: 100%;
    min-height: 2.35em;
    font-size: .78rem;
    overflow-wrap: anywhere;
    font-weight: 650;
    line-height: 1.17;
    text-align: center;
    text-shadow: 0 1px 3px rgb(7, 33, 43), 0 0 10px rgb(7, 33, 43), 0 0 22px rgba(7, 33, 43, .9);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  dialog.sheet {
    width: 100%;
    max-width: min(560px, 100%);
    margin: auto auto 0;
    border: 0;
    border-radius: 28px 28px 0 0;
    padding: 28px var(--pad) calc(24px + env(safe-area-inset-bottom));
    background: rgba(7, 33, 43, .95);
    color: var(--sand);
  }
  dialog.sheet::backdrop { background: rgba(7, 33, 43, .55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  dialog.sheet[open] { animation: sheet-up .32s cubic-bezier(.2, .7, .2, 1); }
  @keyframes sheet-up { from { transform: translateY(40px); opacity: 0; } }
  @media (min-width: 700px) { dialog.sheet { margin: auto; border-radius: 28px; } }
  .sheet h3 { margin: 0; font-size: 1.7rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
  .sheet .note { margin: 8px 0 0; color: var(--mist); }
  .sheet .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 0; }
  .sheet .action { padding: 14px 20px; font-size: 1.05rem; }
  .sheet.urgent .action.action-primary { background: var(--flare); color: #fff; }
  .sheet .sheet-foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); }
  .sheet .sheet-foot button { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 11px 18px; font-weight: 600; cursor: pointer; }
  .sheet .sheet-foot button[aria-pressed="true"] { background: var(--amber); color: var(--ink); border-color: transparent; }

  .shortcuts { margin: 5vh 0 0; }
  .shortcuts h2 { font-size: 1rem; font-weight: 700; margin: 0 0 10px; }
  .shortcuts ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .shortcuts a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 18px;
    border-radius: 999px;
    background: var(--glass-strong);
    border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    font-weight: 700;
    text-decoration: none;
  }
  .shortcuts + .panel { margin-top: 5vh; }

  .empty { margin: 12vh 0; padding: 24px; border-radius: var(--radius-panel); background: var(--glass-strong); }
  .empty p { margin: 0; }

  footer {
    max-width: var(--measure);
    margin: 0 auto;
    padding: 0 var(--pad) calc(40px + env(safe-area-inset-bottom));
    display: flex;
    flex-wrap: wrap;
    gap: 12px 24px;
    align-items: center;
    justify-content: space-between;
    color: var(--sand);
    font-size: .95rem;
  }
  footer button {
    border: 1px solid var(--line);
    background: var(--glass-strong);
    border-radius: 999px;
    padding: 10px 18px;
    cursor: pointer;
    font-weight: 600;
  }

  .reveal { animation: reveal .7s cubic-bezier(.2, .7, .2, 1) both; }
  @keyframes reveal { from { opacity: 0; transform: translateY(18px); } }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .backdrop::before, .backdrop img { transition: none; }
    .reveal, dialog.sheet[open] { animation: none; }
  }
</style>
</head>
<body>

<div class="backdrop" aria-hidden="true">
  <img class="on" data-key="home" src="assets/home.jpg" alt="" onerror="this.remove()">
</div>

<section class="lock" id="lock">
  <h1 class="wordmark">CLEAR</h1>
  <p>Resident hub. Enter the passcode to open it.</p>
  <form id="lock-form" autocomplete="off">
    <input id="passcode" type="password" placeholder="Passcode" aria-label="Passcode" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <button type="submit" id="unlock">Unlock</button>
  </form>
  <div class="status" id="lock-status" role="status" aria-live="polite"></div>
</section>

<div id="hub" hidden>
  <header class="hero" id="hero">
    <h1 class="wordmark">CLEAR</h1>
    <p class="meaning" id="meaning"></p>
    <p class="updated" id="updated"></p>
  </header>

  <div class="bar">
    <div class="bar-inner">
      <div class="bar-row">
        <label class="search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
          <input id="search" type="search" placeholder="Search everything" aria-label="Search everything" autocomplete="off">
        </label>
        <button type="button" class="view-toggle" id="view-toggle"></button>
      </div>
      <nav class="jump" id="jump" aria-label="Sections"></nav>
    </div>
  </div>

  <main id="main">
    <section class="shortcuts" id="shortcuts" hidden>
      <h2>Your shortcuts</h2>
      <ul id="shortcut-list"></ul>
    </section>
    <div id="sections"></div>
    <div class="empty" id="empty" hidden><p>Nothing matches that search. Try a shorter word.</p></div>
  </main>

  <footer>
    <span>Keep the things you use most in your shortcuts.</span>
    <button type="button" id="relock">Lock this device</button>
  </footer>
</div>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
  <h3 id="sheet-title"></h3>
  <p class="note" id="sheet-note"></p>
  <div class="actions" id="sheet-actions"></div>
  <div class="sheet-foot">
    <button type="button" id="sheet-pin"></button>
    <button type="button" id="sheet-close">Close</button>
  </div>
</dialog>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const STORE_KEY = 'clear.unlock';
  const PINS_KEY = 'clear.pins';
  const VIEW_KEY = 'clear.view';

  // Pictures for the bubbles. An entry picks one with "icon"; without it the bubble shows initials.
  const GLYPHS = {
    shield: 'M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z',
    medical: 'M9 4h6v5h5v6h-5v5H9v-5H4V9h5z',
    flame: 'M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-8.5z',
    wrench: 'M20 7a4.5 4.5 0 0 1-6 4.2L6.5 18.7a1.8 1.8 0 0 1-2.500-2.500L11.500 8.700A4.500 4.500 0 0 1 17 3l-2.500 2.500 1 2.500 2.500 1z',
    building: 'M5 21V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v16M15 10h3a1 1 0 0 1 1 1v10M3 21h18M9 8h2M9 12h2M9 16h2',
    car: 'M5 16v2M19 16v2M4 16h16v-4l-2-5H6l-2 5zM7.5 13h.01M16.5 13h.01',
    drop: 'M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z',
    basket: 'M4 10h16l-1.5 9h-13zM8 10l3-6M16 10l-3-6',
    food: 'M7 3v7a2 2 0 0 0 4 0V3M9 12v9M17 3c-2 2-2 6 0 9v9',
    scissors: 'M6 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM8.5 7.5 20 19M8.5 16.5 20 5',
    sparkle: 'M12 3l1.8 5.2L19 10l-5.200 1.800L12 17l-1.800-5.200L5 10l5.200-1.800zM19 16v4M17 18h4',
    wifi: 'M3 9a14 14 0 0 1 18 0M6 13a9 9 0 0 1 12 0M9.5 16.5a4 4 0 0 1 5 0M12 20h.01',
    book: 'M5 4h13v14H7a2 2 0 0 0 0 4h11M5 4v16',
    form: 'M7 3h7l4 4v14H7zM14 3v4h4M10 12h5M10 16h5',
    pass: 'M4 6h16v12H4zM7 15c.5-1.500 3.500-1.500 4 0M9 11h.01M14 10h3M14 14h3',
    list: 'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01',
    phone: 'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2',
    pin: 'M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11zM12 12.500a2.500 2.500 0 1 0 0-5 2.500 2.500 0 0 0 0 5z',
    heart: 'M12 20s-7-4.500-7-10a4 4 0 0 1 7-2.500A4 4 0 0 1 19 10c0 5.500-7 10-7 10z',
    cart: 'M3 4h3l2 11h10l2-8H7M9 20h.01M18 20h.01',
    bolt: 'M13 3 5 13h6l-1 8 8-10h-6z',
    home: 'M4 11l8-7 8 7v9H4zM10 20v-6h4v6',
    plane: 'M3 13l18-8-6 16-3-7z',
    calendar: 'M5 6h14v14H5zM5 10h14M9 4v4M15 4v4'
  };

  const ICONS = {
    phone: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
    chat: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg>',
    open: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
    star: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.2 6-5.5-3-5.5 3 1.2-6L3.200 9.400l6.100-.8z"/></svg>'
  };

  // Browser storage can be unavailable (private mode); the hub still works without it.
  const store = {
    get(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* ignore */ } },
    remove(key) { try { localStorage.removeItem(key); } catch { /* ignore */ } }
  };

  const toBytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  const toB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));

  async function keyFromPasscode(passcode, vault) {
    const base = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(passcode.trim()), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: toBytes(vault.salt), iterations: vault.iterations, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }

  async function openVault(key, vault) {
    const plain = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: toBytes(vault.iv) }, key, toBytes(vault.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  /* ---------- Rendering ---------- */

  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  };
  const webUrl = (url) => (/^https?:\/\//i.test(url || '') ? url : null);
  const dial = (num) => (num || '').replace(/[^\d+]/g, '');

  function actionLink(href, label, icon, primary) {
    const a = el('a', 'action' + (primary ? ' action-primary' : ''));
    a.href = href;
    a.innerHTML = ICONS[icon];
    a.append(label);
    if (href.startsWith('http')) { a.target = '_blank'; a.rel = 'noopener'; }
    return a;
  }

  function itemActions(item) {
    const out = [];
    const phone = dial(item.phone);
    const wa = dial(item.whatsapp).replace('+', '');
    const url = webUrl(item.url);
    if (phone) out.push(actionLink('tel:' + phone, 'Call ' + item.phone, 'phone', true));
    if (wa) out.push(actionLink('https://wa.me/' + wa, 'WhatsApp', 'chat', !phone));
    if (url) out.push(actionLink(url, item.linkLabel || 'Open', 'open', !phone && !wa));
    return out;
  }

  let pins = new Set(store.get(PINS_KEY) || []);
  let content = null;
  let view = store.get(VIEW_KEY) === 'list' ? 'list' : 'bubbles';

  const itemId = (section, item) => section.id + '|' + item.title;
  function togglePin(id) {
    pins.has(id) ? pins.delete(id) : pins.add(id);
    store.set(PINS_KEY, [...pins]);
    renderShortcuts();
    return pins.has(id);
  }

  function glyph(item) {
    const path = GLYPHS[item.icon];
    if (!path) {
      const words = item.title.split(/\s+/).filter((w) => /^[a-z0-9]/i.test(w));
      return el('span', 'initials', words.slice(0, 2).map((w) => w[0].toUpperCase()).join(''));
    }
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '2');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    svg.setAttribute('aria-hidden', 'true');
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', path);
    svg.append(p);
    return svg;
  }

  /* ---------- Entry sheet ---------- */

  let sheetPinId = null;
  function pinLabel(on) {
    const b = $('sheet-pin');
    b.textContent = on ? 'In your shortcuts' : 'Add to shortcuts';
    b.setAttribute('aria-pressed', String(on));
  }
  function openSheet(section, item) {
    const sheet = $('sheet');
    sheetPinId = itemId(section, item);
    sheet.classList.toggle('urgent', !!item.urgent);
    $('sheet-title').textContent = item.title;
    $('sheet-note').textContent = item.note || '';
    const links = itemActions(item);
    $('sheet-actions').replaceChildren(...(links.length ? links : [el('span', 'pending', 'Details still to add')]));
    pinLabel(pins.has(sheetPinId));
    sheet.showModal();
  }

  /* ---------- Pages ---------- */

  // The home page shows the categories. Each category is its own page: #/contacts, #/services…
  let route = '';
  function readRoute() {
    const id = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
    route = content.sections.some((s) => s.id === id) ? id : '';
  }

  const hit = (section, item, q) =>
    [item.title, item.note, item.phone, section.title].join(' ').toLowerCase().includes(q);

  // What to show: null means the category bubbles; otherwise groups of entries.
  function scope(q) {
    if (q) {
      return content.sections
        .map((section) => ({ section, items: section.items.filter((item) => hit(section, item, q)) }))
        .filter((group) => group.items.length);
    }
    if (route) {
      const section = content.sections.find((s) => s.id === route);
      return [{ section, items: section.items }];
    }
    return null;
  }

  function bubble(tag, cls, icon, label) {
    const b = el(tag, 'bubble ' + cls);
    const disc = el('span', 'disc');
    disc.append(glyph(icon));
    b.append(disc, el('span', 'label', label));
    return b;
  }

  function drawCategories() {
    const wrap = el('section', 'cluster');
    const row = el('ul', 'categories');
    for (const section of content.sections) {
      const b = bubble('a', 'k-' + (section.kind || 'services'), { icon: section.icon, title: section.title }, section.title);
      b.href = '#/' + section.id;
      const li = el('li');
      li.append(b);
      row.append(li);
    }
    wrap.append(row);
    $('sections').append(wrap);
  }

  function drawBubbleGroups(groups) {
    for (const { section, items } of groups) {
      const cluster = el('section', 'cluster');
      cluster.append(el('h2', null, section.title));
      if (section.blurb) cluster.append(el('p', 'blurb', section.blurb));
      if (!items.length) cluster.append(el('p', 'blurb', 'Nothing has been added here yet.'));
      const comb = el('ul', 'honeycomb');
      for (const item of items) {
        // An entry that is only a link opens straight away; anything else shows its card.
        const direct = webUrl(item.url) && !dial(item.phone) && !dial(item.whatsapp);
        const cls = 'k-' + (section.kind || 'services') + (item.urgent ? ' urgent' : '');
        const b = bubble(direct ? 'a' : 'button', cls, item, item.title);
        if (direct) {
          b.href = webUrl(item.url);
          b.target = '_blank';
          b.rel = 'noopener';
        } else {
          b.type = 'button';
          b.addEventListener('click', () => openSheet(section, item));
        }
        const li = el('li');
        li.append(b);
        comb.append(li);
      }
      cluster.append(comb);
      $('sections').append(cluster);
    }
  }

  function drawListGroups(groups) {
    for (const { section, items } of groups) {
      const panel = el('section', 'panel');
      panel.append(el('h2', null, section.title));
      if (section.blurb) panel.append(el('p', 'blurb', section.blurb));

      if (!items.length) panel.append(el('p', 'blurb', 'Nothing has been added here yet.'));
      const list = el('ul', 'items ' + (section.kind || 'services'));
      for (const item of items) {
        const id = itemId(section, item);
        const li = el('li', 'item' + (item.urgent ? ' urgent' : ''));

        const text = el('div');
        text.append(el('h3', null, item.title));
        if (item.note) text.append(el('p', 'note', item.note));

        const pin = el('button', 'pin');
        pin.type = 'button';
        pin.innerHTML = ICONS.star;
        pin.setAttribute('aria-label', 'Keep ' + item.title + ' in your shortcuts');
        pin.setAttribute('aria-pressed', String(pins.has(id)));
        pin.addEventListener('click', () => pin.setAttribute('aria-pressed', String(togglePin(id))));

        const actions = el('div', 'actions');
        const links = itemActions(item);
        if (links.length) actions.append(...links);
        else actions.append(el('span', 'pending', 'Details still to add'));

        li.append(text, pin, actions);
        list.append(li);
      }
      panel.append(list);
      $('sections').append(panel);
    }
  }

  // Bubbles are full size mid-screen and shrink toward the top and bottom edges.
  const calm = window.matchMedia('(prefers-reduced-motion: reduce)');
  let swellQueued = false;
  function swell() {
    swellQueued = false;
    if (calm.matches) return;
    const mid = window.innerHeight / 2;
    const reach = window.innerHeight * 0.62;
    for (const disc of document.querySelectorAll('.honeycomb .disc')) {
      const box = disc.parentElement.getBoundingClientRect();
      if (box.bottom < -80 || box.top > window.innerHeight + 80) continue;
      const far = Math.min(1, Math.abs(box.top + box.height / 2 - mid) / reach);
      disc.style.setProperty('--s', (1 - 0.42 * far * far).toFixed(3));
    }
  }
  const queueSwell = () => { if (!swellQueued) { swellQueued = true; requestAnimationFrame(swell); } };
  window.addEventListener('scroll', queueSwell, { passive: true });
  window.addEventListener('resize', queueSwell);

  /* ---------- Pictures ---------- */

  // assets/home.jpg sits behind the home page; assets/<category id>.jpg behind each category.
  // A category without its own picture keeps the home one.
  const backdrop = document.querySelector('.backdrop');
  function loadPictures() {
    for (const section of content.sections) {
      if (!/^[a-z0-9-]+$/.test(section.id)) continue;
      const img = new Image();
      img.alt = '';
      img.dataset.key = section.id;
      img.addEventListener('error', () => { img.remove(); showPicture(); });
      img.addEventListener('load', showPicture);
      img.src = 'assets/' + section.id + '.jpg';
      backdrop.append(img);
    }
  }
  function showPicture() {
    const own = route && [...backdrop.querySelectorAll('img')].some((i) => i.dataset.key === route && i.complete && i.naturalWidth);
    const key = own ? route : 'home';
    for (const img of backdrop.querySelectorAll('img')) img.classList.toggle('on', img.dataset.key === key);
    const index = content.sections.findIndex((s) => s.id === route);
    backdrop.style.setProperty('--hue', (own || index < 0 ? 0 : (index + 1) * 62) + 'deg');
  }

  function draw() {
    const q = $('search').value.trim().toLowerCase();
    const groups = scope(q);
    $('sections').replaceChildren();
    $('hero').hidden = route !== '';
    $('view-toggle').hidden = !groups;
    $('view-toggle').textContent = view === 'bubbles' ? 'List' : 'Bubbles';
    $('view-toggle').setAttribute('aria-label', view === 'bubbles' ? 'Show as a list' : 'Show as bubbles');
    if (!groups) drawCategories();
    else if (view === 'bubbles') drawBubbleGroups(groups);
    else drawListGroups(groups);
    $('empty').hidden = !(groups && !groups.length);
    for (const link of $('jump').children) {
      if (link.dataset.route === route) {
        link.setAttribute('aria-current', 'page');
        $('jump').scrollLeft = link.offsetLeft - $('jump').offsetLeft - 60;
      } else link.removeAttribute('aria-current');
    }
    renderShortcuts();
    showPicture();
    swell();
  }

  function renderShortcuts() {
    const list = $('shortcut-list');
    list.replaceChildren();
    for (const section of content.sections) {
      for (const item of section.items) {
        if (!pins.has(itemId(section, item))) continue;
        const first = itemActions(item)[0];
        const a = el('a');
        a.href = first ? first.href : '#/' + section.id;
        if (first && first.target) { a.target = first.target; a.rel = first.rel; }
        a.textContent = item.title;
        const li = el('li');
        li.append(a);
        list.append(li);
      }
    }
    $('shortcuts').hidden = !list.children.length || route !== '' || $('search').value.trim() !== '';
  }

  function renderFrame() {
    // What the name stands for, with each initial picked out.
    const meaning = $('meaning');
    meaning.replaceChildren();
    for (const word of (content.meaning || '').split(/\s+/).filter(Boolean)) {
      if (/^[a-z]/i.test(word)) meaning.append(el('b', null, word[0]), word.slice(1) + ' ');
      else meaning.append(word + ' ');
    }
    meaning.hidden = !content.meaning;
    $('updated').textContent = content.updated ? 'Updated ' + content.updated : '';
    const jump = $('jump');
    jump.replaceChildren();
    for (const [id, title] of [['', 'Home'], ...content.sections.map((s) => [s.id, s.title])]) {
      const link = el('a', null, title);
      link.href = '#/' + id;
      link.dataset.route = id;
      jump.append(link);
    }
  }

  /* ---------- Lock and unlock ---------- */

  function showHub(data, animate) {
    content = data;
    readRoute();
    renderFrame();
    loadPictures();
    draw();
    $('lock').hidden = true;
    $('hub').hidden = false;
    if (animate) {
      $('hub').classList.add('reveal');
      window.scrollTo(0, 0);
    }
  }

  window.addEventListener('hashchange', () => {
    if (!content) return;
    readRoute();
    $('search').value = '';
    if ($('sheet').open) $('sheet').close();
    draw();
    window.scrollTo(0, 0);
  });

  async function start() {
    const status = $('lock-status');
    const button = $('unlock');

    if (!window.crypto || !crypto.subtle) {
      status.textContent = 'This page has to be opened over https to unlock.';
      button.disabled = true;
      return;
    }

    let vault;
    try {
      const res = await fetch('vault.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error(res.status);
      vault = await res.json();
    } catch {
      status.textContent = 'The hub could not load. Check your connection and reload the page.';
      button.disabled = true;
      return;
    }

    // Already unlocked on this device? The saved key only fits the current passcode.
    const saved = store.get(STORE_KEY);
    if (saved && saved.salt === vault.salt) {
      try {
        const key = await crypto.subtle.importKey('raw', toBytes(saved.key), 'AES-GCM', false, ['decrypt']);
        showHub(await openVault(key, vault), false);
        return;
      } catch { store.remove(STORE_KEY); }
    }

    $('lock-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      status.textContent = 'Unlocking…';
      try {
        const key = await keyFromPasscode($('passcode').value, vault);
        const data = await openVault(key, vault);
        store.set(STORE_KEY, { salt: vault.salt, key: toB64(await crypto.subtle.exportKey('raw', key)) });
        status.textContent = '';
        showHub(data, true);
      } catch {
        status.textContent = 'That passcode did not work. Check it and try again.';
        $('passcode').select();
      } finally {
        button.disabled = false;
      }
    });
  }

  $('search').addEventListener('input', draw);
  $('view-toggle').addEventListener('click', () => {
    view = view === 'bubbles' ? 'list' : 'bubbles';
    store.set(VIEW_KEY, view);
    draw();
  });
  $('sheet-pin').addEventListener('click', () => pinLabel(togglePin(sheetPinId)));
  $('sheet-close').addEventListener('click', () => $('sheet').close());
  $('sheet').addEventListener('click', (event) => { if (event.target === $('sheet')) $('sheet').close(); });
  $('relock').addEventListener('click', () => {
    store.remove(STORE_KEY);
    location.reload();
  });

  start();
})();
</script>
</body>
</html>
